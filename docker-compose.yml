services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly
      POSTGRES_DB: ledgerly
    ports: ["5432:5432"]
    volumes:
      - ./packages/db/migrations:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    ports: ["6379:6379"]
